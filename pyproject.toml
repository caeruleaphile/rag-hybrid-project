[project]
name = "rag-hybrid-project"
version = "0.1.0"
description = "here"
readme = "README.md"
authors = [
    { name = "caeruleaphile", email = "bannour.01imane@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-openai>=1.4.3",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "unstructured>=0.25.2",
    "uvicorn>=0.52.1",
]

[project.scripts]
rag-hybrid-project = "rag_hybrid_project:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
explicit_package_bases = true
